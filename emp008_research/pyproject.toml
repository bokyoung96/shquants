[project]
name = "emp008-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "openpyxl>=3.1",
  "matplotlib==3.10.8",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
